name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint:web
      - run: npm run test:web
      - run: npm run build
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/navigation/requirements-dev.lock
      - run: python -m venv services/navigation/.venv
      - run: services/navigation/.venv/bin/python -m pip install -r services/navigation/requirements-dev.lock
      - run: services/navigation/.venv/bin/python -m pip install --no-deps -e 'services/navigation[dev]'
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm run lint:backend
      - run: npm run test:backend
